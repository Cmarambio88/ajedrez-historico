name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pruebas-motor:
    name: Pruebas del motor de ajedrez
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/engine.test.js

  apk:
    name: APK de depuración
    needs: pruebas-motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceptar licencias del SDK de Android
        run: yes | "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Compilar
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Compilar paquete AAB de Play Store (sin firmar)
        run: gradle :app:bundleRelease --no-daemon --stacktrace
      - name: Guardar AAB como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ajedrez-historico-aab-sin-firmar
          path: app/build/outputs/bundle/release/app-release.aab
      - name: Guardar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ajedrez-historico-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar en «Releases» (solo rama main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ajedrez-historico.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git tag -f ultima
          git push -f origin refs/tags/ultima
          gh release delete ultima --yes 2>/dev/null || true
          gh release create ultima ajedrez-historico.apk --prerelease --title "Última versión (APK)" \
            --notes "APK de depuración generado automáticamente desde la rama main. Instálalo en Android permitiendo «instalar apps desconocidas»."
        env:
          GH_TOKEN: ${{ github.token }}
